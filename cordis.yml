    sentinel:
      watchCodeChanges: true
      watchErrors: true
      watchPerformance: true
      aggregationWindow: 5
      # 真实工作负载入站通道：HTTP POST :9878（scripts/dsh-work.mjs 驱动）
      signalSources:
        - type: webhook
          port: 9878
    qualityThreshold: 0.7
    maxRetries: 2
    globalTimeout: 300000
    enableProgress: true
    progressPort: 9877
    verbose: true
    experienceStorePath: .scheduler/memory.json
    encryption:
      enabled: false
      algorithm: aes-256-gcm
      fullFileEncryption: true
    sync:
      localNodeId: node-dev-01
      peers: []
    consensus:
      enabled: false
      localNodeId: node-01
      consensusPort: 9880
      electionTimeoutMin: 1500
      electionTimeoutMax: 3000
      heartbeatInterval: 500
      cluster: []
    hotReload:
      enabled: false
      watchDirs:
      - src
      watchExtensions:
      - .ts
      - .tsx
      - .js
      debounceMs: 1000
      buildCommand: pnpm build
      autoRollback: true
    tenants: []
    dataDir: .scheduler
    memoryFastPathThreshold: 0.9
    autonomy:
      enabled: true
      heartbeatMs: 30000
      # 新臂入场探索：glm-5.3 引入期保持对照流量（τ2 结构学习数据前提）
      exploration:
        enabled: true
        sampleFloor: 30
        budget: 1000000
        bonus: 0.25
        overrideRate: 0.3
      # 创世纪 G4：快路径解钉历史模型（复用"怎么做"，不固化"用谁做"）
      fastPath:
        reuseModels: false
      symbiosis:
        enabled: true
        plasticity:
          enabled: true
          persistPath: .scheduler/plasticity.json
          rulesPath: .scheduler/plasticity-rules.json
          gateWindow: 50
          probeSize: 50
          # 引入期参数：更频繁的固化尝试（证据不足时无害空转）
          consolidateEvery: 60
          # 创世纪 G3：流动性操作（引入期预算加倍，常态后回调 6）
          probes:
            enabled: true
            maxPerHour: 12
    hostFusion:
      enabled: true
      observeToolResults: true
      governToolCalls: true
      failureEscalationThreshold: 3
